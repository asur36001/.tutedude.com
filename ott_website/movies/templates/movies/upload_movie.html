{% extends 'base.html' %}
{% block title %}Upload Movie - OTT Platform{% endblock %}

{% block content %}
<section class="form-section">
    <h2>Upload New Movie</h2>
    <form method="post" enctype="multipart/form-data" class="upload-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>
</section>
{% endblock %}
