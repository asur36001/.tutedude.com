{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OTT Platform{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <h1><a href="{% url 'home' %}">My OTT Platform</a></h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'upload_movie' %}">Upload Movie</a>
            <a href="{% url 'shorts_dashboard' %}">Shorts Analytics</a>
            <a href="/admin/">Admin</a>
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
